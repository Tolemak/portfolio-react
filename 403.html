<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>403 – Brak dostępu</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #6366f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f1a;
        --text: #f1f5f9;
        --text-muted: #94a3b8;
        --accent: #818cf8;
      }
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .error-container { text-align: center; }
    h1 { font-size: 4rem; color: var(--accent); margin-bottom: 0.5em; }
    p { font-size: 1.3rem; color: var(--text-muted); }
    a { color: var(--accent); text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="error-container">
    <h1>403</h1>
    <p>Brak dostępu do tej zawartości.</p>
    <p><a href="/">Powrót na stronę główną</a></p>
  </div>
</body>
</html>
